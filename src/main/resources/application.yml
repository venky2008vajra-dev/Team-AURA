server:
  port: 8080

spring:
  application:
    name: scamcheck-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scamcheck}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ScamCheckHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-min-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hour

risk-scoring:
  weights:
    PAYMENT_FEE_REQUEST: 30
    URGENT_LANGUAGE: 15
    UNREALISTIC_SALARY: 20
    OTP_REQUEST: 25
    SENSITIVE_DOCUMENT_REQUEST: 20
    SUSPICIOUS_KEYWORD: 10
  thresholds:
    low-max: 29
    medium-max: 59
    high-max: 79

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs